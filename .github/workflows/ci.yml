name: Continuous Integration

on:
  push:
    branches: [ main, prelaunch-cleanup ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify zero fake data policy
        run: npm run check:fake-data

      - name: Build client and server bundles
        run: npm run build

      - name: Run automated verification tests
        run: |
          cd server
          npm run test:verify
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/nodalconnector_ci
          JWT_SECRET: ci-test-secret-key-32-characters-long!!

